name: Heater
products:
  - id: 6b5i5bg5aesvfnea
    manufacturer: Kewei
    model: 00000336yn
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat"
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 5
          max: 50
      - id: 3
        name: current_temperature
        type: integer
        unit: C
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: af
            value: Anti Frost
          - dps_val: low
            value: Low
          - dps_val: high
            value: High
